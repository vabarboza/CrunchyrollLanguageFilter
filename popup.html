<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Crunchyroll Language Filter</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap');

        :root {
            --bg-dark: #141519;
            --bg-card: #23252b;
            --bg-hover: #2a2d35;
            --accent: #ff6400;
            --accent-hover: #ff7e29;
            --accent-light: rgba(255, 100, 0, 0.12);
            --text-main: #f8f9fa;
            --text-muted: #a0a0a0;
            --border-color: #3a3f4a;
            --border-radius-lg: 12px;
            --border-radius-md: 8px;
            --transition-speed: 0.2s;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            width: 320px;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Scrollbar */
        .languages-grid::-webkit-scrollbar {
            width: 6px;
        }

        .languages-grid::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 3px;
        }

        .languages-grid::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        .languages-grid::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        /* Header styling */
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            background-color: var(--accent-light);
            border-radius: var(--border-radius-md);
            color: var(--accent);
            flex-shrink: 0;
        }

        .logo-container svg {
            width: 22px;
            height: 22px;
        }

        .header-content {
            display: flex;
            flex-direction: column;
        }

        .header-title {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: -0.3px;
        }

        .header-subtitle {
            margin: 0;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 1px;
        }

        /* Quick actions bar */
        .actions-bar {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            flex: 1;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 10px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition-speed) ease;
        }

        .action-btn:hover {
            background-color: var(--bg-hover);
            color: var(--text-main);
            border-color: var(--text-muted);
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        /* Languages Grid */
        .languages-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            max-height: 290px;
            overflow-y: auto;
            padding-right: 4px;
        }

        /* Custom Checkbox/Card styling */
        .lang-card {
            display: flex;
            align-items: center;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-md);
            padding: 10px;
            cursor: pointer;
            user-select: none;
            transition: all var(--transition-speed) ease;
            position: relative;
        }

        .lang-card:hover {
            background-color: var(--bg-hover);
            border-color: var(--accent);
            transform: translateY(-1px);
        }

        /* Hide native checkbox */
        .lang-card input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
            height: 0;
            width: 0;
        }

        /* Checked states */
        .lang-card:has(input:checked) {
            background-color: var(--accent-light);
            border-color: var(--accent);
            box-shadow: 0 2px 8px rgba(255, 100, 0, 0.1);
        }

        .custom-checkbox {
            width: 14px;
            height: 14px;
            border: 2px solid var(--border-color);
            border-radius: 4px;
            margin-right: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-speed) ease;
            flex-shrink: 0;
            background-color: rgba(0, 0, 0, 0.2);
        }

        .lang-card:hover .custom-checkbox {
            border-color: var(--accent-hover);
        }

        .lang-card:has(input:checked) .custom-checkbox {
            border-color: var(--accent);
            background-color: var(--accent);
        }

        .custom-checkbox::after {
            content: "";
            width: 3px;
            height: 6px;
            border: solid var(--text-main);
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
            display: none;
            margin-bottom: 1px;
        }

        .lang-card:has(input:checked) .custom-checkbox::after {
            display: block;
        }

        .lang-name {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .lang-card:has(input:checked) .lang-name {
            font-weight: 600;
        }

        /* Footer styling */
        .footer {
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
            margin-top: 2px;
        }

        .save-btn {
            width: 100%;
            background-color: var(--accent);
            color: var(--text-main);
            border: none;
            padding: 10px 16px;
            border-radius: var(--border-radius-md);
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 100, 0, 0.2);
            transition: all var(--transition-speed) ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .save-btn:hover {
            background-color: var(--accent-hover);
            box-shadow: 0 6px 16px rgba(255, 100, 0, 0.3);
            transform: translateY(-1px);
        }

        .save-btn:active {
            transform: translateY(1px);
            box-shadow: 0 2px 6px rgba(255, 100, 0, 0.2);
        }
    </style>
</head>

<body>

    <div class="header">
        <div class="logo-container">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                stroke-linejoin="round">
                <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
            </svg>
        </div>
        <div class="header-content">
            <h1 class="header-title">Crunchyroll Filter</h1>
            <span class="header-subtitle">Select languages to hide</span>
        </div>
    </div>

    <div class="actions-bar">
        <button id="select-all" class="action-btn">Hide All</button>
        <button id="clear-all" class="action-btn">Show All</button>
    </div>

    <div class="languages-grid">
        <label class="lang-card">
            <input type="checkbox" value="Deutsch">
            <span class="custom-checkbox"></span>
            <span class="lang-name">Deutsch</span>
        </label>

        <label class="lang-card">
            <input type="checkbox" value="English">
            <span class="custom-checkbox"></span>
            <span class="lang-name">English</span>
        </label>

        <label class="lang-card">
            <input type="checkbox" value="España">
            <span class="custom-checkbox"></span>
            <span class="lang-name">Español</span>
        </label>

        <label class="lang-card">
            <input type="checkbox" value="हिंदी">
            <span class="custom-checkbox"></span>
            <span class="lang-name">हिंदी</span>
        </label>

        <label class="lang-card">
            <input type="checkbox" value="தமிழ்">
            <span class="custom-checkbox"></span>
            <span class="lang-name">தமிழ்</span>
        </label>

        <label class="lang-card">
            <input type="checkbox" value="العربية">
            <span class="custom-checkbox"></span>
            <span class="lang-name">العربية</span>
        </label>

        <label class="lang-card">
            <input type="checkbox" value="América Latina">
            <span class="custom-checkbox"></span>
            <span class="lang-name">América Latina</span>
        </label>

        <label class="lang-card">
            <input type="checkbox" value="Português (Brasil)">
            <span class="custom-checkbox"></span>
            <span class="lang-name">Português (Brasil)</span>
        </label>

        <label class="lang-card">
            <input type="checkbox" value="Français">
            <span class="custom-checkbox"></span>
            <span class="lang-name">Français</span>
        </label>

        <label class="lang-card">
            <input type="checkbox" value="Italiano">
            <span class="custom-checkbox"></span>
            <span class="lang-name">Italiano</span>
        </label>

        <label class="lang-card">
            <input type="checkbox" value="తెలుగు">
            <span class="custom-checkbox"></span>
            <span class="lang-name">తెలుగు</span>
        </label>

        <label class="lang-card">
            <input type="checkbox" value="Bahasa Indonesia">
            <span class="custom-checkbox"></span>
            <span class="lang-name">B. Indonesia</span>
        </label>

        <label class="lang-card">
            <input type="checkbox" value="ไทย">
            <span class="custom-checkbox"></span>
            <span class="lang-name">ไทย</span>
        </label>

        <label class="lang-card">
            <input type="checkbox" value="普通话">
            <span class="custom-checkbox"></span>
            <span class="lang-name">普通话</span>
        </label>
    </div>

    <div class="footer">
        <button id="save" class="save-btn">
            <span>Save Changes</span>
        </button>
    </div>

    <script src="popup.js"></script>

</body>

</html>
